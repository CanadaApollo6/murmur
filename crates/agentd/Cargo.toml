[package]
name = "agentd"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
repository = { workspace = true }

[dependencies]
uuid = { workspace = true }
rap-protocol = { path = "../rap-protocol" }
reqwest = { workspace = true }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
http-body-util = "0.1"
bytes = "1"
infinity-protocol = { path = "../infinity-protocol" }
futures-util = { workspace = true, features = ["sink"] }
tokio-util = { version = "0.7", features = ["codec"] }
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
mimalloc = { git = "https://github.com/microsoft/mimalloc.git", rev = "56dc5eb80145f9a3ba7ca23d47c6a248b9d8586c", default-features = false }
sha2 = "0.10"
tokio-tungstenite = "0.26"
subtle = "2"
base64 = "0.22"
url = "2"
toml = "0.9"
async-trait = { workspace = true }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { version = "0.3", features = ["serde"] }
tokio = { workspace = true, features = ["rt", "process", "io-util", "io-std", "time", "net", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ulid = { version = "1", features = ["serde"] }
include_dir = { version = "0.7", optional = true }

# For the `e2e-web` feature only (browser tests in `tests/web_e2e.rs`). This is a
# regular optional dependency because Cargo has no optional dev-dependencies.
# Nothing outside `tests/` uses it.
playwright-rs = { version = "0.14", optional = true, default-features = false, features = ["macros", "screenshot-diff", "rustls-tls-webpki-roots"] }

[features]
# Embed `agentd-web/dist` in the binary. The build runs npm.
bundled-web = ["dep:include_dir"]
# Browser tests of the bundled UI against a real agentd. These need npm and
# Playwright's browser (`npx playwright@1.60.0 install chromium`).
e2e-web = ["bundled-web", "dep:playwright-rs"]

[dev-dependencies]
rusqlite = { version = "0.32.1", features = ["hooks"] }
rap-client = { path = "../rap-client" }
infinity-daemon = { path = "../infinity-daemon" }
infinity-agent-core = { path = "../infinity-agent-core" }
infinity-rap-bridge = { path = "../infinity-rap-bridge" }
infinity-provider-protocol = { path = "../infinity-provider-protocol", features = ["mock"] }
rap-test-servers = { path = "../rap-test-servers" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
jsonschema = { version = "0.61.1", default-features = false }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "user", "fs", "dir"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", features = ["time"] }

[[bin]]
name = "agentd-fake-acp"
path = "tests/support/fake_acp.rs"

[[bin]]
name = "agentd"
path = "src/bin/agentd.rs"

[[bin]]
name = "agentctl"
path = "src/bin/agentctl.rs"
